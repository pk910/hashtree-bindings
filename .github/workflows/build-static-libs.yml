name: Build Static Libraries

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-static-libs.yml'

jobs:
  check-hashtree-version:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      hashtree_commit: ${{ steps.check.outputs.hashtree_commit }}
      hashtree_short: ${{ steps.check.outputs.hashtree_short }}
      hashtree_tag: ${{ steps.check.outputs.hashtree_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch latest hashtree from upstream
        run: |
          cd hashtree
          git fetch origin main
          git checkout origin/main
          cd ..

      - name: Check if hashtree version changed
        id: check
        run: |
          # Get latest hashtree commit (after updating to upstream)
          HASHTREE_COMMIT=$(git -C hashtree rev-parse HEAD)
          HASHTREE_SHORT=$(git -C hashtree rev-parse --short HEAD)

          # Try to get tag info
          HASHTREE_TAG=$(git -C hashtree describe --tags --exact-match 2>/dev/null || echo "")
          if [ -z "$HASHTREE_TAG" ]; then
            # Not on exact tag, get closest tag with distance
            HASHTREE_TAG=$(git -C hashtree describe --tags 2>/dev/null || echo "untagged")
          fi

          echo "hashtree_commit=$HASHTREE_COMMIT" >> $GITHUB_OUTPUT
          echo "hashtree_short=$HASHTREE_SHORT" >> $GITHUB_OUTPUT
          echo "hashtree_tag=$HASHTREE_TAG" >> $GITHUB_OUTPUT

          echo "Latest hashtree commit: $HASHTREE_COMMIT"
          echo "Latest hashtree tag: $HASHTREE_TAG"

          # Check stored version
          if [ -f lib/HASHTREE_VERSION ]; then
            STORED_COMMIT=$(cat lib/HASHTREE_VERSION)
            echo "Stored hashtree commit: $STORED_COMMIT"

            if [ "$HASHTREE_COMMIT" = "$STORED_COMMIT" ]; then
              echo "Hashtree version unchanged, skipping build"
              echo "needs_build=false" >> $GITHUB_OUTPUT
            else
              echo "Hashtree version changed, build needed"
              echo "needs_build=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "No stored version found, build needed"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

          # Force build on manual trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger, forcing build"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

  build-linux-amd64:
    runs-on: ubuntu-22.04
    needs: check-hashtree-version
    if: needs.check-hashtree-version.outputs.needs_build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout target hashtree commit
        run: |
          cd hashtree
          git fetch origin
          git checkout ${{ needs.check-hashtree-version.outputs.hashtree_commit }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build Linux AMD64 library
        run: |
          cd hashtree/src
          make clean
          # Build with reproducible flags
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          make CFLAGS="-O3 -Wall -Werror -static -fno-plt -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic"
          # Copy the library to a simple location
          cp ../build/lib/libhashtree.a ./libhashtree.a
          # Remove non-deterministic archive metadata
          strip --strip-debug ./libhashtree.a || true
          # Normalize archive
          ranlib ./libhashtree.a
          # Record the exact compiler used, for reproducible verification.
          gcc --version | head -1 > libhashtree.a.buildinfo
          # Generate checksum
          sha256sum libhashtree.a > libhashtree.a.sha256

      - name: Upload Linux AMD64 library
        uses: actions/upload-artifact@v4
        with:
          name: libhashtree-linux-amd64
          path: |
            hashtree/src/libhashtree.a
            hashtree/src/libhashtree.a.sha256
            hashtree/src/libhashtree.a.buildinfo
          retention-days: 7

  build-linux-arm64:
    runs-on: ubuntu-22.04
    needs: check-hashtree-version
    if: needs.check-hashtree-version.outputs.needs_build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout target hashtree commit
        run: |
          cd hashtree
          git fetch origin
          git checkout ${{ needs.check-hashtree-version.outputs.hashtree_commit }}

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Linux ARM64 library
        run: |
          cd hashtree/src
          make clean
          # Build with reproducible flags
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          make CC=aarch64-linux-gnu-gcc ARM=1 CFLAGS="-O3 -Wall -Werror -static -fno-plt -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic"
          # Copy the library to a simple location
          cp ../build/lib/libhashtree.a ./libhashtree.a
          # Remove non-deterministic archive metadata
          aarch64-linux-gnu-strip --strip-debug ./libhashtree.a || true
          # Normalize archive
          aarch64-linux-gnu-ranlib ./libhashtree.a
          # Record the exact compiler used, for reproducible verification.
          aarch64-linux-gnu-gcc --version | head -1 > libhashtree.a.buildinfo
          # Generate checksum
          sha256sum libhashtree.a > libhashtree.a.sha256

      - name: Upload Linux ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: libhashtree-linux-arm64
          path: |
            hashtree/src/libhashtree.a
            hashtree/src/libhashtree.a.sha256
            hashtree/src/libhashtree.a.buildinfo
          retention-days: 7

  build-linux-riscv64:
    runs-on: ubuntu-22.04
    needs: check-hashtree-version
    if: needs.check-hashtree-version.outputs.needs_build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout target hashtree commit
        run: |
          cd hashtree
          git fetch origin
          git checkout ${{ needs.check-hashtree-version.outputs.hashtree_commit }}

      - name: Install RISC-V64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu

      - name: Build Linux RISC-V64 library
        run: |
          cd hashtree/src
          make clean
          # Build with reproducible flags
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          # Override CFLAGS/ASFLAGS for reproducible builds. We must re-add the
          # RISC-V -march here because GNU make ignores the Makefile's `+=` for
          # variables set on the command line, which would otherwise drop the
          # Zbb/Zknh march and break the rev8/roriw opcodes in the .S files.
          make CC=riscv64-linux-gnu-gcc RISCV=1 CFLAGS="-O3 -Wall -Werror -static -fno-plt -ffile-prefix-map=$(pwd)=. -march=rv64gc_zbb_zk" ASFLAGS="-g -fpic -march=rv64gc_zbb_zk"
          # Copy the library to a simple location
          cp ../build/lib/libhashtree.a ./libhashtree.a
          # Remove non-deterministic archive metadata
          riscv64-linux-gnu-strip --strip-debug ./libhashtree.a || true
          # Normalize archive
          riscv64-linux-gnu-ranlib ./libhashtree.a
          # Record the exact compiler used, for reproducible verification.
          riscv64-linux-gnu-gcc --version | head -1 > libhashtree.a.buildinfo
          # Generate checksum
          sha256sum libhashtree.a > libhashtree.a.sha256

      - name: Upload Linux RISC-V64 library
        uses: actions/upload-artifact@v4
        with:
          name: libhashtree-linux-riscv64
          path: |
            hashtree/src/libhashtree.a
            hashtree/src/libhashtree.a.sha256
            hashtree/src/libhashtree.a.buildinfo
          retention-days: 7

  build-darwin-arm64:
    runs-on: macos-14  # Apple Silicon macOS
    needs: check-hashtree-version
    if: needs.check-hashtree-version.outputs.needs_build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout target hashtree commit
        run: |
          cd hashtree
          git fetch origin
          git checkout ${{ needs.check-hashtree-version.outputs.hashtree_commit }}

      - name: Build Darwin ARM64 library
        run: |
          cd hashtree/src
          make clean
          # Build with reproducible flags
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          make CFLAGS="-O3 -Wall -Werror -mmacosx-version-min=11.0 -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic"
          # Copy the library to a simple location
          cp ../build/lib/libhashtree.a ./libhashtree.a
          # Remove non-deterministic archive metadata
          strip -S ./libhashtree.a || true
          # Normalize archive
          ranlib ./libhashtree.a
          # macOS BSD ar/ranlib ignore SOURCE_DATE_EPOCH and stamp the real build
          # time (plus uid/gid) into every member header, breaking reproducibility.
          # Zero those fields so identical objects yield an identical archive.
          python3 "$GITHUB_WORKSPACE/.github/scripts/zero_ar_metadata.py" ./libhashtree.a
          # Record the exact compiler used, for reproducible verification.
          cc --version | head -1 > libhashtree.a.buildinfo
          # Generate checksum
          shasum -a 256 libhashtree.a > libhashtree.a.sha256

      - name: Upload Darwin ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: libhashtree-darwin-arm64
          path: |
            hashtree/src/libhashtree.a
            hashtree/src/libhashtree.a.sha256
            hashtree/src/libhashtree.a.buildinfo
          retention-days: 7

  build-windows-amd64:
    runs-on: windows-latest
    needs: check-hashtree-version
    if: needs.check-hashtree-version.outputs.needs_build == 'true'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout target hashtree commit
        shell: bash
        run: |
          cd hashtree
          git fetch origin
          git checkout ${{ needs.check-hashtree-version.outputs.hashtree_commit }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # Do NOT force a full system upgrade (`update: true`): it pulls the
          # latest rolling MinGW gcc on every run, which silently changes the
          # compiled object code (and thus the archive bytes) even with no
          # upstream change. Installing without upgrading keeps the toolchain
          # stable across runs; the exact gcc version is recorded in the bundle.
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            make

      - name: Build Windows AMD64 library
        run: |
          cd hashtree/src
          make clean
          # Build with reproducible flags
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          make CFLAGS="-O3 -Wall -Werror -static -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic"
          # Copy the library (Windows might create .lib, normalize to .a)
          if [ -f "../build/lib/libhashtree.lib" ]; then
            cp ../build/lib/libhashtree.lib ./libhashtree.a
          else
            cp ../build/lib/libhashtree.a ./libhashtree.a
          fi
          # Remove non-deterministic archive metadata
          strip --strip-debug ./libhashtree.a || true
          # Normalize archive
          ranlib ./libhashtree.a
          # Record the exact compiler used, for reproducible verification.
          gcc --version | head -1 > libhashtree.a.buildinfo
          # Generate checksum
          sha256sum libhashtree.a > libhashtree.a.sha256

      - name: Upload Windows AMD64 library
        uses: actions/upload-artifact@v4
        with:
          name: libhashtree-windows-amd64
          path: |
            hashtree/src/libhashtree.a
            hashtree/src/libhashtree.a.sha256
            hashtree/src/libhashtree.a.buildinfo
          retention-days: 7

  collect-libraries:
    runs-on: ubuntu-latest
    needs: [check-hashtree-version, build-linux-amd64, build-linux-arm64, build-linux-riscv64, build-darwin-arm64, build-windows-amd64]
    if: needs.check-hashtree-version.outputs.needs_build == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update hashtree submodule to target commit
        run: |
          cd hashtree
          git fetch origin
          git checkout ${{ needs.check-hashtree-version.outputs.hashtree_commit }}
          cd ..

      - name: Create lib directories
        run: |
          mkdir -p lib/{linux_amd64,linux_arm64,linux_riscv64,darwin_arm64,windows_amd64}

      - name: Download all libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libhashtree-*
          merge-multiple: false

      - name: Move libraries and checksums to correct locations
        run: |
          # Copy only the library and its checksum into lib/ (the .buildinfo
          # provenance files stay in the download dirs and feed the README step).
          # Artifact dirs use hyphens (libhashtree-linux-amd64); lib/ dirs use
          # underscores (linux_amd64).
          for platform in linux_amd64 linux_arm64 linux_riscv64 darwin_arm64 windows_amd64; do
            art="libhashtree-${platform//_/-}"
            cp "$art/libhashtree.a" "lib/$platform/"
            cp "$art/libhashtree.a.sha256" "lib/$platform/"
          done

      - name: Verify libraries and checksums
        run: |
          echo "=== Library Information ==="
          echo "Linux AMD64:" && file lib/linux_amd64/libhashtree.a
          echo "Linux ARM64:" && file lib/linux_arm64/libhashtree.a
          echo "Linux RISC-V64:" && file lib/linux_riscv64/libhashtree.a
          echo "Darwin ARM64:" && file lib/darwin_arm64/libhashtree.a
          echo "Windows AMD64:" && file lib/windows_amd64/libhashtree.a
          echo ""
          echo "=== Checksum Verification ==="
          for platform in linux_amd64 linux_arm64 linux_riscv64 darwin_arm64 windows_amd64; do
            echo "Verifying $platform..."
            cd lib/$platform
            if command -v sha256sum >/dev/null; then
              sha256sum -c libhashtree.a.sha256
            else
              shasum -a 256 -c libhashtree.a.sha256
            fi
            cd ../..
          done

      - name: Update hashtree version file
        run: |
          echo "${{ needs.check-hashtree-version.outputs.hashtree_commit }}" > lib/HASHTREE_VERSION

      - name: Create library bundle README
        env:
          HASHTREE_COMMIT: ${{ needs.check-hashtree-version.outputs.hashtree_commit }}
          HASHTREE_TAG: ${{ needs.check-hashtree-version.outputs.hashtree_tag }}
          BUILD_TRIGGER: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: |
          export BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          # Pull the exact compiler version recorded by each build job. Artifact
          # dirs use hyphens (libhashtree-linux-amd64) vs lib/ underscores. Strip
          # CR (MSYS2/Windows writes CRLF) so it can't break the README table.
          read_bi() {
            f="libhashtree-${1//_/-}/libhashtree.a.buildinfo"
            if [ -f "$f" ]; then head -1 "$f" | tr -d '\r'; else echo "unknown"; fi
          }
          export CC_AMD64="$(read_bi linux_amd64)"
          export CC_ARM64="$(read_bi linux_arm64)"
          export CC_RISCV64="$(read_bi linux_riscv64)"
          export CC_DARWIN="$(read_bi darwin_arm64)"
          export CC_WINDOWS="$(read_bi windows_amd64)"

          python3 - << 'PYEOF'
          import os

          vals = {
              "__COMMIT__": os.environ.get("HASHTREE_COMMIT", ""),
              "__TAG__": os.environ.get("HASHTREE_TAG", ""),
              "__DATE__": os.environ.get("BUILD_DATE", ""),
              "__TRIGGER__": os.environ.get("BUILD_TRIGGER", ""),
              "__REPO__": os.environ.get("REPOSITORY", ""),
              "__WORKFLOW__": os.environ.get("WORKFLOW", ""),
              "__RUNID__": os.environ.get("RUN_ID", ""),
              "__CC_AMD64__": os.environ.get("CC_AMD64", "unknown"),
              "__CC_ARM64__": os.environ.get("CC_ARM64", "unknown"),
              "__CC_RISCV64__": os.environ.get("CC_RISCV64", "unknown"),
              "__CC_DARWIN__": os.environ.get("CC_DARWIN", "unknown"),
              "__CC_WINDOWS__": os.environ.get("CC_WINDOWS", "unknown"),
          }

          tpl = r"""# Static Library Bundle

          ## Hashtree Version
          - **Commit:** __COMMIT__
          - **Tag:** __TAG__

          ## Build Information
          - **Build Date:** __DATE__
          - **Build Trigger:** __TRIGGER__
          - **Repository:** __REPO__
          - **Workflow:** __WORKFLOW__
          - **Run ID:** __RUNID__

          ## Contents
          Each platform directory contains:
          - `libhashtree.a` - Static library with platform-specific optimizations
          - `libhashtree.a.sha256` - SHA256 checksum for verification

          ### Platform Details:
          - **linux_amd64/** - Linux x86_64 with AVX2/AVX512/SHANI optimizations
          - **linux_arm64/** - Linux ARM64 with NEON/SHA2 optimizations
          - **linux_riscv64/** - Linux RISC-V64 with Zbb / Zknh scalar-crypto (runtime-detected)
          - **darwin_arm64/** - macOS Apple Silicon with SHA2 optimizations
          - **windows_amd64/** - Windows x86_64 with AVX2/AVX512/SHANI optimizations

          **Note:** macOS Intel (darwin_amd64) is not included - uses pure Go fallback implementation

          ## Build Environment

          Every library is built from the hashtree commit above. `SOURCE_DATE_EPOCH`
          is exported from that commit's timestamp before each build:

          ```bash
          export SOURCE_DATE_EPOCH=$(git -C hashtree log -1 --format=%ct)
          ```

          | Platform | Host / toolchain | Compiler | `make` invocation |
          |----------|------------------|----------|-------------------|
          | linux_amd64 | ubuntu-22.04, native | `__CC_AMD64__` | `make CFLAGS="-O3 -Wall -Werror -static -fno-plt -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic"` |
          | linux_arm64 | ubuntu-22.04, gcc-aarch64-linux-gnu | `__CC_ARM64__` | `make CC=aarch64-linux-gnu-gcc ARM=1 CFLAGS="-O3 -Wall -Werror -static -fno-plt -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic"` |
          | linux_riscv64 | ubuntu-22.04, gcc-riscv64-linux-gnu | `__CC_RISCV64__` | `make CC=riscv64-linux-gnu-gcc RISCV=1 CFLAGS="-O3 -Wall -Werror -static -fno-plt -ffile-prefix-map=$(pwd)=. -march=rv64gc_zbb_zk" ASFLAGS="-g -fpic -march=rv64gc_zbb_zk"` |
          | darwin_arm64 | macos-14, Apple clang | `__CC_DARWIN__` | `make CFLAGS="-O3 -Wall -Werror -mmacosx-version-min=11.0 -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic"` |
          | windows_amd64 | windows-latest, MSYS2 MINGW64 | `__CC_WINDOWS__` | `make CFLAGS="-O3 -Wall -Werror -static -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic"` |

          After `make`, the archive is copied out of `build/lib/`, stripped, and re-indexed:

          | Platform | Archive normalization |
          |----------|-----------------------|
          | linux_amd64 | `strip --strip-debug` then `ranlib` |
          | linux_arm64 | `aarch64-linux-gnu-strip --strip-debug` then `aarch64-linux-gnu-ranlib` |
          | linux_riscv64 | `riscv64-linux-gnu-strip --strip-debug` then `riscv64-linux-gnu-ranlib` |
          | darwin_arm64 | `strip -S` then `ranlib`, then zero `ar` member mtime/uid/gid |
          | windows_amd64 | `strip --strip-debug` then `ranlib` |

          ## Reproducible Builds

          Given the same compiler version, the build is deterministic:
          - `SOURCE_DATE_EPOCH` pins embedded timestamps to the commit time.
          - `-ffile-prefix-map=$(pwd)=.` strips absolute build paths from the objects.
          - Debug symbols are stripped and the archive index is rebuilt with `ranlib`.
          - GNU `ar`/`ranlib` (Linux and Windows/MinGW) write deterministic archives by
            default. macOS BSD tools do not, so member `mtime`/`uid`/`gid` are zeroed
            afterwards (see `.github/scripts/zero_ar_metadata.py`).

          Because the object code depends on the exact compiler, a byte-for-byte match
          requires the **same compiler version** shown in the table above.

          ## Verification

          ### 1. Checksum
          ```bash
          cd lib/<platform>
          sha256sum -c libhashtree.a.sha256   # macOS: shasum -a 256 -c libhashtree.a.sha256
          ```

          ### 2. Rebuild & compare (Docker)
          Rebuild from upstream in a clean container and compare the digest with the
          published one. Each command is self-contained: copy it, run it, and check
          the printed hash against the matching `libhashtree.a.sha256`. These cover
          the Linux targets; macOS and Windows use native toolchains that cannot run
          in a Linux container.

          **linux_amd64** - expect the hash in `lib/linux_amd64/libhashtree.a.sha256`:
          ```bash
          docker run --rm -e COMMIT=__COMMIT__ ubuntu:22.04 bash -c '
            set -eu
            apt-get update -qq
            apt-get install -y -qq git ca-certificates make build-essential >/dev/null
            git clone -q https://github.com/OffchainLabs/hashtree /h && git -C /h checkout -q "$COMMIT"
            cd /h/src
            export SOURCE_DATE_EPOCH=$(git -C /h log -1 --format=%ct)
            make CFLAGS="-O3 -Wall -Werror -static -fno-plt -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic" >/dev/null
            cp ../build/lib/libhashtree.a . && strip --strip-debug libhashtree.a && ranlib libhashtree.a
            sha256sum libhashtree.a
          '
          ```

          **linux_arm64** - expect the hash in `lib/linux_arm64/libhashtree.a.sha256`:
          ```bash
          docker run --rm -e COMMIT=__COMMIT__ ubuntu:22.04 bash -c '
            set -eu
            apt-get update -qq
            apt-get install -y -qq git ca-certificates make binutils gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu >/dev/null
            git clone -q https://github.com/OffchainLabs/hashtree /h && git -C /h checkout -q "$COMMIT"
            cd /h/src
            export SOURCE_DATE_EPOCH=$(git -C /h log -1 --format=%ct)
            make CC=aarch64-linux-gnu-gcc ARM=1 CFLAGS="-O3 -Wall -Werror -static -fno-plt -ffile-prefix-map=$(pwd)=." ASFLAGS="-g -fpic" >/dev/null
            cp ../build/lib/libhashtree.a . && aarch64-linux-gnu-strip --strip-debug libhashtree.a && aarch64-linux-gnu-ranlib libhashtree.a
            sha256sum libhashtree.a
          '
          ```

          **linux_riscv64** - expect the hash in `lib/linux_riscv64/libhashtree.a.sha256`:
          ```bash
          docker run --rm -e COMMIT=__COMMIT__ ubuntu:22.04 bash -c '
            set -eu
            apt-get update -qq
            apt-get install -y -qq git ca-certificates make binutils gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu >/dev/null
            git clone -q https://github.com/OffchainLabs/hashtree /h && git -C /h checkout -q "$COMMIT"
            cd /h/src
            export SOURCE_DATE_EPOCH=$(git -C /h log -1 --format=%ct)
            make CC=riscv64-linux-gnu-gcc RISCV=1 CFLAGS="-O3 -Wall -Werror -static -fno-plt -ffile-prefix-map=$(pwd)=. -march=rv64gc_zbb_zk" ASFLAGS="-g -fpic -march=rv64gc_zbb_zk" >/dev/null
            cp ../build/lib/libhashtree.a . && riscv64-linux-gnu-strip --strip-debug libhashtree.a && riscv64-linux-gnu-ranlib libhashtree.a
            sha256sum libhashtree.a
          '
          ```

          > Verified reproducible with gcc 11.4.0 (Ubuntu 22.04). If a digest differs,
          > confirm your `gcc --version` matches the **Compiler** column above; a
          > different compiler patch release can change the output.
          """

          for key, value in vals.items():
              tpl = tpl.replace(key, value)
          if not tpl.endswith("\n"):
              tpl += "\n"
          with open("lib/README.md", "w") as fh:
              fh.write(tpl)
          PYEOF

      - name: Update main README with hashtree version
        env:
          HASHTREE_COMMIT: ${{ needs.check-hashtree-version.outputs.hashtree_commit }}
          HASHTREE_TAG: ${{ needs.check-hashtree-version.outputs.hashtree_tag }}
        run: |
          SHORT_COMMIT="${HASHTREE_COMMIT:0:7}"

          python3 - "$HASHTREE_COMMIT" "$HASHTREE_TAG" "$SHORT_COMMIT" << 'PYEOF'
          import re
          import sys
          from textwrap import dedent

          commit = sys.argv[1]
          tag = sys.argv[2]
          short = sys.argv[3]

          version_section = dedent(f"""
          ## Hashtree Version

          Built from [hashtree](https://github.com/OffchainLabs/hashtree) library:
          - **Commit:** [`{short}`](https://github.com/OffchainLabs/hashtree/commit/{commit})
          - **Version:** `{tag}`
          """).strip() + "\n"

          with open('README.md', 'r') as f:
              content = f.read()

          # Remove existing Hashtree Version section if present
          content = re.sub(r'## Hashtree Version\n.*?(?=\n## |\Z)', '', content, flags=re.DOTALL)

          # Add new section after Overview section
          content = re.sub(r'(## Overview\n.*?)(\n## )', r'\1\n' + version_section + r'\n\2', content, count=1, flags=re.DOTALL)

          with open('README.md', 'w') as f:
              f.write(content)
          PYEOF

      - name: Commit and push changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          HASHTREE_SHORT: ${{ needs.check-hashtree-version.outputs.hashtree_short }}
          HASHTREE_COMMIT: ${{ needs.check-hashtree-version.outputs.hashtree_commit }}
          HASHTREE_TAG: ${{ needs.check-hashtree-version.outputs.hashtree_tag }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hashtree lib/ README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update static libraries for hashtree@${HASHTREE_SHORT}

          Built from hashtree commit: ${HASHTREE_COMMIT}
          Hashtree version: ${HASHTREE_TAG}
          Workflow run: ${WORKFLOW_URL}"
            git push
          fi

      - name: Upload static library bundle
        uses: actions/upload-artifact@v4
        with:
          name: hashtree-static-libs-${{ github.sha }}
          path: lib/
          retention-days: 30
